name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cài dependency
        run: flutter pub get

      - name: Kiểm tra định dạng
        run: dart format --output=none --set-exit-if-changed .

      - name: Phân tích tĩnh
        run: flutter analyze

      - name: Chạy test
        run: flutter test
